<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCKLAS English Duel - Brawl Stars 1v1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial Black', Impact, sans-serif; }
    body {
      background: radial-gradient(circle at center, #1e0836 0%, #0a0214 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      user-select: none;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 96%;
      max-width: 1100px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 2rem;
      color: #ffde00;
      text-shadow: 3px 3px 0 #d9381e, 5px 5px 0 #000;
    }
    .sub-title {
      font-size: 1rem;
      color: #00f0ff;
      text-shadow: 1px 1px 0 #000;
    }
    .btn-top {
      background: #ffaa00;
      color: #000;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
    }
    .btn-top:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }

    /* 角色挑選介面 */
    #selectScreen {
      width: 96%;
      max-width: 950px;
      background: rgba(0, 0, 0, 0.6);
      border: 4px solid #ffde00;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 222, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .select-status {
      font-size: 1.6rem;
      color: #ffde00;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #000;
    }
    .preview-box {
      display: flex;
      gap: 50px;
      align-items: center;
      margin-bottom: 25px;
    }
    .player-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 140px;
    }
    .preview-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: #222;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .preview-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .roster-card {
      background: #2d164d;
      border: 3px solid #552586;
      border-radius: 15px;
      padding: 10px 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s;
    }
    .roster-card:hover {
      transform: translateY(-5px) scale(1.05);
      border-color: #ffde00;
      box-shadow: 0 0 15px #ffde00;
    }
    .roster-card img {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin-bottom: 5px;
    }
    .btn-brawl {
      background: #22c55e;
      color: #fff;
      font-size: 1.5rem;
      padding: 12px 40px;
      border: 4px solid #000;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 7px 0 #15803d;
      display: none;
    }
    .btn-brawl:active { transform: translateY(4px); box-shadow: 0 3px 0 #15803d; }

    /* 戰鬥競技場 */
    #battleScreen {
      display: none;
      width: 96%;
      max-width: 1100px;
      position: relative;
    }
    .arena-box {
      background: rgba(18, 5, 34, 0.7);
      border: 4px solid #4338ca;
      border-radius: 25px;
      padding: 30px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      height: 360px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(67, 56, 202, 0.5);
    }
    .fighter-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 220px;
      z-index: 5;
    }
    .fighter-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.2s ease;
    }
    .fighter-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 5px solid #ffde00;
      overflow: hidden;
      background: #000;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }
    .fighter-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .hp-bar-wrap {
      width: 180px;
      height: 25px;
      background: #111;
      border: 3px solid #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #22c55e);
      transition: width 0.4s ease;
    }
    .hp-text { font-size: 1.1rem; color: #fff; text-shadow: 1px 1px 0 #000; }

    /* 攻擊子彈與動畫效果 */
    .projectile {
      position: absolute;
      width: 45px;
      height: 45px;
      font-size: 2.2rem;
      display: none;
      z-index: 10;
      transition: all 0.35s linear;
    }
    .damage-text {
      position: absolute;
      font-size: 2.5rem;
      color: #ef4444;
      font-weight: bold;
      text-shadow: 2px 2px 0 #fff, 4px 4px 0 #000;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }
    @keyframes floatDamage {
      0% { opacity: 1; transform: translateY(0) scale(1.3); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.9); }
    }
    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); filter: brightness(1); }
      20% { transform: translateX(-15px); filter: brightness(2) drop-shadow(0 0 15px red); }
      40% { transform: translateX(15px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }

    /* 競技場中央控制台 */
    .arena-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }
    .turn-badge {
      font-size: 1.4rem;
      color: #ffde00;
      background: rgba(0,0,0,0.6);
      padding: 6px 20px;
      border-radius: 15px;
      border: 2px solid #ffde00;
      margin-bottom: 15px;
      text-shadow: 1px 1px 0 #000;
    }
    .btn-attack {
      background: #ff0055;
      color: #fff;
      font-size: 1.4rem;
      padding: 12px 30px;
      border: 4px solid #000;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 0 #88002e;
      transition: all 0.1s;
    }
    .btn-attack:active { transform: translateY(4px); box-shadow: 0 2px 0 #88002e; }

    /* 答題視窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #1e1b4b;
      border: 5px solid #ffde00;
      border-radius: 25px;
      padding: 30px;
      width: 90%;
      max-width: 680px;
      text-align: center;
      box-shadow: 0 0 40px #ffde00;
    }
    .q-turn { font-size: 1.4rem; color: #ffde00; margin-bottom: 8px; }
    .q-cat { color: #38bdf8; font-size: 1.1rem; margin-bottom: 15px; }
    .q-text { font-size: 1.7rem; color: #fff; margin-bottom: 25px; line-height: 1.3; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .opt-btn {
      background: #4338ca;
      color: #fff;
      border: 3px solid #000;
      border-radius: 14px;
      padding: 15px;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #000;
    }
    .opt-btn.correct { background: #10b981 !important; border-color: #fff; }
    .opt-btn.wrong { background: #ef4444 !important; opacity: 0.5; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>BCKLAS ENGLISH DUEL</h1>
      <div class="sub-title">Brawl Stars 1v1 Arena • Answer to Attack!</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-top" onclick="restartSelection()">🔄 重新選角</button>
      <button class="btn-top" onclick="toggleFullScreen()">⛶ 全螢幕</button>
    </div>
  </header>

  <!-- 1. 角色選擇介面 -->
  <div id="selectScreen">
    <div class="select-status" id="selectInstruction">Player 1 (Red Side): Choose Your Brawler!</div>
    <div class="preview-box">
      <div class="player-preview">
        <div style="color:#ef4444; font-size:1.1rem; margin-bottom:5px;">RED SIDE (P1)</div>
        <div class="preview-avatar" style="border-color:#ef4444;"><img id="p1PreviewImg" src="" style="display:none;"></div>
        <div id="p1Name" style="color:#ffde00; font-size:1.2rem;">?</div>
      </div>
      <div style="font-size:2rem; color:#ffde00;">VS</div>
      <div class="player-preview">
        <div style="color:#3b82f6; font-size:1.1rem; margin-bottom:5px;">BLUE SIDE (P2)</div>
        <div class="preview-avatar" style="border-color:#3b82f6;"><img id="p2PreviewImg" src="" style="display:none;"></div>
        <div id="p2Name" style="color:#ffde00; font-size:1.2rem;">?</div>
      </div>
    </div>
    <div class="roster-grid" id="rosterContainer"></div>
    <button class="btn-brawl" id="startBrawlBtn" onclick="enterBattle()">🔥 BRAWL! (進入對決) 🔥</button>
  </div>

  <!-- 2. 戰鬥競技場介面 -->
  <div id="battleScreen">
    <div class="arena-box">
      <!-- 玩家 1 (紅方) -->
      <div class="fighter-side">
        <div class="fighter-card" id="fighterCard1">
          <div class="fighter-avatar" style="border-color:#ef4444;">
            <img id="f1Img" src="">
          </div>
          <div id="f1Name" style="font-size:1.4rem; color:#ffde00; margin-bottom:6px;">Crow</div>
          <div class="hp-bar-wrap"><div class="hp-fill" id="f1HpFill"></div></div>
          <div class="hp-text" id="f1HpText">HP: 3 / 3</div>
        </div>
      </div>

      <!-- 中央控制台 -->
      <div class="arena-center">
        <div class="turn-badge" id="currentTurnBadge">Attacker: Crow</div>
        <button class="btn-attack" onclick="openBattleQuiz()">⚡ 發動攻擊 (Battle Quiz)</button>
      </div>

      <!-- 玩家 2 (藍方) -->
      <div class="fighter-side">
        <div class="fighter-card" id="fighterCard2">
          <div class="fighter-avatar" style="border-color:#3b82f6;">
            <img id="f2Img" src="">
          </div>
          <div id="f2Name" style="font-size:1.4rem; color:#ffde00; margin-bottom:6px;">Mortis</div>
          <div class="hp-bar-wrap"><div class="hp-fill" id="f2HpFill"></div></div>
          <div class="hp-text" id="f2HpText">HP: 3 / 3</div>
        </div>
      </div>

      <!-- 動態攻擊子彈 & 傷害文字 -->
      <div class="projectile" id="bullet">💥</div>
      <div class="damage-text" id="damageIndicator">-1 HP!</div>
    </div>
  </div>

  <!-- 3. 英文題目彈出框 -->
  <div class="modal" id="quizModal">
    <div class="modal-content">
      <div class="q-turn" id="modalTurnTitle">Crow is Attacking!</div>
      <div class="q-cat" id="modalCat">Category: Grammar</div>
      <div class="q-text" id="modalQ">Question here?</div>
      <div class="options-grid" id="modalOpts"></div>
    </div>
  </div>

  <script>
    // 英雄名單與官方頭像
    const brawlersRoster = [
      { name: "Crow", img: "https://cdn.brawlify.com/brawlers/borders/16000016.png", icon: "🪶" },
      { name: "Mortis", img: "https://cdn.brawlify.com/brawlers/borders/16000015.png", icon: "🦇" },
      { name: "El Primo", img: "https://cdn.brawlify.com/brawlers/borders/16000004.png", icon: "🥊" },
      { name: "Bo", img: "https://cdn.brawlify.com/brawlers/borders/16000008.png", icon: "🏹" },
      { name: "Barley", img: "https://cdn.brawlify.com/brawlers/borders/16000003.png", icon: "🍾" },
      { name: "Shelly", img: "https://cdn.brawlify.com/brawlers/borders/16000000.png", icon: "💥" }
    ];

    // 12 題精選小學英文題庫
    const questions = [
      { cat: "Phonics", q: "Which word has the 'short a' sound?", opts: ["Cake", "Cat", "Rain", "Train"], ans: 1 },
      { cat: "Grammar (Tenses)", q: "Yesterday, Kelly ________ to the library.", opts: ["go", "goes", "went", "going"], ans: 2 },
      { cat: "Vocabulary", q: "What is the opposite of 'Strong'?", opts: ["Weak", "Heavy", "Brave", "Fast"], ans: 0 },
      { cat: "Prepositions", q: "The pencil is ________ the pencil case.", opts: ["in", "on", "under", "behind"], ans: 0 },
      { cat: "Spelling", q: "Which spelling is correct?", opts: ["Beatiful", "Beautiful", "Beautifull", "Beutiful"], ans: 1 },
      { cat: "Grammar (Pronouns)", q: "This is Tom. ________ is my best friend.", opts: ["She", "He", "They", "It"], ans: 1 },
      { cat: "Phonics", q: "Which word rhymes with 'night'?", opts: ["Right", "Tree", "Boat", "Fish"], ans: 0 },
      { cat: "Vocabulary", q: "Where do you borrow English storybooks?", opts: ["Canteen", "Library", "Art Room", "Playground"], ans: 1 },
      { cat: "Grammar (Tenses)", q: "Look! The children ________ football now.", opts: ["play", "plays", "are playing", "played"], ans: 2 },
      { cat: "Vocabulary", q: "An elephant is big, but a mouse is ________.", opts: ["huge", "tall", "small", "long"], ans: 2 },
      { cat: "Prepositions", q: "The birds are flying ________ the sky.", opts: ["in", "on", "at", "under"], ans: 0 },
      { cat: "Spelling", q: "Rearrange: 't-e-a-c-h-r-e' to spell a person:", opts: ["Doctor", "Teacher", "Nurse", "Farmer"], ans: 1 }
    ];

    let p1Brawler = null;
    let p2Brawler = null;
    let selectingPlayer = 1; // 1 = P1, 2 = P2
    let currentAttacker = 1; // 1 = P1, 2 = P2
    let p1Hp = 3;
    let p2Hp = 3;
    let hasAnswered = false;

    // 音效合成器 (安全保護)
    let audioCtx = null;
    function playBeep(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // 初始化選角畫面
    function initRoster() {
      const container = document.getElementById('rosterContainer');
      container.innerHTML = '';
      brawlersRoster.forEach((b) => {
        const card = document.createElement('div');
        card.className = 'roster-card';
        card.innerHTML = `<img src="${b.img}" alt="${b.name}"><div>${b.name}</div>`;
        card.onclick = () => selectBrawler(b);
        container.appendChild(card);
      });
    }

    function selectBrawler(brawler) {
      if (selectingPlayer === 1) {
        p1Brawler = brawler;
        document.getElementById('p1Name').innerText = brawler.name;
        const img = document.getElementById('p1PreviewImg');
        img.src = brawler.img;
        img.style.display = 'block';
        selectingPlayer = 2;
        document.getElementById('selectInstruction').innerText = "Player 2 (Blue Side): Choose Your Brawler!";
        playBeep(440, 'sine', 0.15);
      } else if (selectingPlayer === 2) {
        p2Brawler = brawler;
        document.getElementById('p2Name').innerText = brawler.name;
        const img = document.getElementById('p2PreviewImg');
        img.src = brawler.img;
        img.style.display = 'block';
        document.getElementById('selectInstruction').innerText = "Ready to Fight! Click Below!";
        document.getElementById('startBrawlBtn').style.display = 'block';
        playBeep(587, 'sine', 0.2);
      }
    }

    function restartSelection() {
      p1Brawler = null;
      p2Brawler = null;
      selectingPlayer = 1;
      p1Hp = 3;
      p2Hp = 3;
      document.getElementById('p1Name').innerText = "?";
      document.getElementById('p2Name').innerText = "?";
      document.getElementById('p1PreviewImg').style.display = 'none';
      document.getElementById('p2PreviewImg').style.display = 'none';
      document.getElementById('startBrawlBtn').style.display = 'none';
      document.getElementById('selectInstruction').innerText = "Player 1 (Red Side): Choose Your Brawler!";
      document.getElementById('battleScreen').style.display = 'none';
      document.getElementById('selectScreen').style.display = 'flex';
    }

    function enterBattle() {
      document.getElementById('selectScreen').style.display = 'none';
      document.getElementById('battleScreen').style.display = 'block';
      document.getElementById('f1Img').src = p1Brawler.img;
      document.getElementById('f1Name').innerText = p1Brawler.name;
      document.getElementById('f2Img').src = p2Brawler.img;
      document.getElementById('f2Name').innerText = p2Brawler.name;
      currentAttacker = 1;
      updateBattleUI();
    }

    function updateBattleUI() {
      document.getElementById('f1HpFill').style.width = `${(p1Hp / 3) * 100}%`;
      document.getElementById('f1HpText').innerText = `HP: ${p1Hp} / 3`;
      document.getElementById('f2HpFill').style.width = `${(p2Hp / 3) * 100}%`;
      document.getElementById('f2HpText').innerText = `HP: ${p2Hp} / 3`;

      const attacker = currentAttacker === 1 ? p1Brawler : p2Brawler;
      const side = currentAttacker === 1 ? "Red" : "Blue";
      document.getElementById('currentTurnBadge').innerText = `Attacker: ${attacker.name} (${side})`;
    }

    function openBattleQuiz() {
      hasAnswered = false;
      const attacker = currentAttacker === 1 ? p1Brawler : p2Brawler;
      const randQ = questions[Math.floor(Math.random() * questions.length)];

      document.getElementById('modalTurnTitle').innerText = `⚔️ ${attacker.name} is Attacking!`;
      document.getElementById('modalCat').innerText = `【Category: ${randQ.cat}】`;
      document.getElementById('modalQ').innerText = randQ.q;
      const optsBox = document.getElementById('modalOpts');
      optsBox.innerHTML = '';

      randQ.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (hasAnswered) return;
          hasAnswered = true;

          if (idx === randQ.ans) {
            btn.classList.add('correct');
            playBeep(523, 'sine', 0.2);
            setTimeout(() => {
              document.getElementById('quizModal').style.display = 'none';
              executeAttackAnimation(true);
            }, 600);
          } else {
            btn.classList.add('wrong');
            playBeep(180, 'sawtooth', 0.3);
            setTimeout(() => {
              document.getElementById('quizModal').style.display = 'none';
              executeAttackAnimation(false);
            }, 700);
          }
        };
        optsBox.appendChild(btn);
      });
      document.getElementById('quizModal').style.display = 'flex';
    }

    // 荒野亂鬥風格攻擊與被打擊動畫
    function executeAttackAnimation(isSuccess) {
      const attackerCard = document.getElementById(currentAttacker === 1 ? 'fighterCard1' : 'fighterCard2');
      const defenderCard = document.getElementById(currentAttacker === 1 ? 'fighterCard2' : 'fighterCard1');
      const bullet = document.getElementById('bullet');
      const dmg = document.getElementById('damageIndicator');
      const attacker = currentAttacker === 1 ? p1Brawler : p2Brawler;

      // 攻擊者微幅前衝蓄力
      attackerCard.style.transform = currentAttacker === 1 ? 'translateX(35px) scale(1.1)' : 'translateX(-35px) scale(1.1)';
      setTimeout(() => { attackerCard.style.transform = 'none'; }, 200);

      if (isSuccess) {
        // 發射飛行能量子彈
        bullet.innerText = attacker.icon || '💥';
        bullet.style.display = 'block';
        bullet.style.top = '150px';
        bullet.style.left = currentAttacker === 1 ? '220px' : '750px';

        setTimeout(() => {
          bullet.style.left = currentAttacker === 1 ? '750px' : '220px';
          playBeep(700, 'triangle', 0.15);
        }, 30);

        // 子彈命中對手
        setTimeout(() => {
          bullet.style.display = 'none';
          playBeep(150, 'square', 0.3);

          // 對手震動與紅光反應
          defenderCard.style.animation = 'shakeCard 0.4s ease';
          setTimeout(() => { defenderCard.style.animation = 'none'; }, 400);

          // 跳出 -1 HP 浮動數字
          dmg.style.left = currentAttacker === 1 ? '770px' : '180px';
          dmg.style.top = '100px';
          dmg.style.animation = 'floatDamage 0.8s forwards';
          setTimeout(() => { dmg.style.animation = 'none'; }, 800);

          // 扣除生命值
          if (currentAttacker === 1) {
            p2Hp = Math.max(0, p2Hp - 1);
          } else {
            p1Hp = Math.max(0, p1Hp - 1);
          }
          updateBattleUI();

          // 判定 Knockout 勝利
          if (p1Hp <= 0 || p2Hp <= 0) {
            const winner = p1Hp > 0 ? p1Brawler.name : p2Brawler.name;
            setTimeout(() => {
              playBeep(880, 'triangle', 0.6);
              alert(`🏆 KNOCKOUT! 恭喜 ${winner} 取得對決總冠軍！`);
              restartSelection();
            }, 500);
            return;
          }

          // 輪換攻守方
          currentAttacker = currentAttacker === 1 ? 2 : 1;
          updateBattleUI();
        }, 380);

      } else {
        // 答錯攻擊落空 (Miss)
        alert(`❌ 攻擊落空 (Miss)！輪到對手反擊！`);
        currentAttacker = currentAttacker === 1 ? 2 : 1;
        updateBattleUI();
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    window.onload = () => { initRoster(); };
  </script>
</body>
</html>
